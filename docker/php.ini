; Matches config/baines.php uploads.max_kb_ceiling (20 MB) with room for the form.
upload_max_filesize = 21M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
