server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Matches docker/php.ini post_max_size.
    client_max_body_size 24m;
    server_tokens off;

    # Hashed build assets never change.
    location /build/ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public media on the local disk (public/media-files is a symlink into the shared
    # storage volume). On S3 these requests never reach the server.
    location /media-files/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        # Keep the port (e.g. localhost:8080): Laravel builds asset and redirect URLs from it.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        # Laravel's Link header lists every preloaded JS chunk; the 4k default is too small.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
